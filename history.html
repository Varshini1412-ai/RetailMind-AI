{% extends "base.html" %}

{% block title %}History{% endblock %}

{% block content %}
<section class="hero">
    <h1>Analysis History</h1>
    <p id="total-count">Loading...</p>
</section>

<div class="charts-row">
    <div id="sentiment-summary-chart" class="chart-box"></div>
    <div id="emotion-summary-chart" class="chart-box"></div>
</div>

<section>
    <h2>Recent entries</h2>
    <table class="history-table">
        <thead>
            <tr>
                <th>Text</th>
                <th>Sentiment</th>
                <th>Emotion</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="history-table-body"></tbody>
    </table>
</section>

<script src="{{ url_for('static', filename='js/history.js') }}"></script>
{% endblock %}
